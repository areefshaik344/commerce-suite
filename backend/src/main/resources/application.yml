spring:
  application:
    name: commerce-suite
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commerce_suite}
    username: ${DB_USER:cs}
    password: ${DB_PASSWORD:cs}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:commerce-suite}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  inventory:
    reservation-ttl-seconds: ${INVENTORY_RES_TTL_SECONDS:900}
    sweeper-delay-ms: ${INVENTORY_SWEEPER_DELAY_MS:60000}
    sweeper-initial-delay-ms: ${INVENTORY_SWEEPER_INIT_DELAY_MS:30000}
  checkout:
    ttl-seconds: ${CHECKOUT_TTL_SECONDS:900}
    sweeper-delay-ms: ${CHECKOUT_SWEEPER_DELAY_MS:60000}
    sweeper-initial-delay-ms: ${CHECKOUT_SWEEPER_INIT_DELAY_MS:45000}
  pricing:
    tax-bps: ${PRICING_TAX_BPS:0}
    platform-fee-bps: ${PRICING_PLATFORM_FEE_BPS:0}
  returns:
    window-days: ${APP_RETURNS_WINDOW_DAYS:7}
  secrets:
    provider: ${SECRET_PROVIDER:env}
  ratelimit:
    enabled: ${RATELIMIT_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{requestId:-},%X{actorId:-},%X{correlationId:-}]"
  level:
    root: INFO
    com.commercesuite: INFO
    org.springframework.security: INFO
