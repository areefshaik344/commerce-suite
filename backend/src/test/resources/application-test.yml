spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret-test-secret-test
    issuer: commerce-suite
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  cors:
    allowed-origins: http://localhost

logging:
  level:
    org.springframework.security: WARN
    com.commercesuite: INFO
