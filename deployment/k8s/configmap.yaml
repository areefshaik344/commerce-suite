apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-suite-config
  namespace: commerce-suite
data:
  SPRING_PROFILES_ACTIVE: "production"
  PORT: "8080"
  CORS_ORIGINS: "https://app.example.com"
  SECRET_PROVIDER: "env"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
