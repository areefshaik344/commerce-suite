groups:
  - name: commerce-platform-slo
    rules:
      - alert: HighHttp5xxRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
              / sum(rate(http_server_requests_seconds_count[5m])) > 0.01
        for: 5m
        labels: { severity: page }
        annotations: { summary: ">1% 5xx for 5m" }

      - alert: P95LatencyHigh
        expr: histogram_quantile(0.95,
              sum(rate(http_server_requests_seconds_bucket[5m])) by (le, uri)) > 0.8
        for: 10m
        labels: { severity: page }

      - alert: OutboxBacklogGrowing
        expr: outbox_pending_count > 5000
        for: 10m
        labels: { severity: page }

      - alert: WebhookDeadLetterSpike
        expr: increase(webhook_dead_letter_total[15m]) > 50
        labels: { severity: page }

      - alert: ReservationContentionHigh
        expr: rate(inventory_reservation_conflict_total[5m]) > 10
        for: 10m
        labels: { severity: ticket }

      - alert: PaymentCaptureFailureRate
        expr: rate(payment_capture_failed_total[10m])
              / rate(payment_capture_total[10m]) > 0.05
        for: 10m
        labels: { severity: page }

      - alert: NotificationDispatchLag
        expr: notification_dispatch_lag_seconds > 60
        for: 10m
        labels: { severity: ticket }

      - alert: DBConnectionsSaturated
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.85
        for: 5m
        labels: { severity: page }

      - alert: JvmHeapPressure
        expr: sum(jvm_memory_used_bytes{area="heap"})
              / sum(jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 10m
        labels: { severity: ticket }

      - alert: ReconciliationDriftDetected
        expr: reconciliation_drift_amount != 0
        labels: { severity: page }
